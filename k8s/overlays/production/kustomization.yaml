# Production on the kubeadm cluster (docs/deploy/KUBERNETES-SETUP.md).
# On another cluster (e.g. GKE), copy this overlay and change the ingress class.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../cluster
  - ../../base
images:
  - name: odiapedia
    newName: ghcr.io/theluckiestsoul/odiapedia
    newTag: latest                # the deploy workflow sets the exact version (sha-xxxxxxx)
patches:
  - target: { kind: Ingress, name: odiapedia }
    patch: |-
      - op: add
        path: /spec/ingressClassName
        value: traefik            # Traefik, installed with Helm (k8s/addons/traefik-values.yaml)
