name: odiapedia
description: "Odiapedia - Encyclopedia of Odisha"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management
  provider: ^6.1.1
  # Markdown rendering
  flutter_markdown: ^0.6.18
  # Network & Caching
  http: ^1.1.0
  cached_network_image: ^3.3.0
  # Storage
  shared_preferences: ^2.2.2
  # Fonts
  google_fonts: ^6.1.0
  # Share functionality
  share_plus: ^7.2.1
  # URL launcher
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/content/
    - assets/images/
